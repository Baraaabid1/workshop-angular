<main class="main">
  <!-- Page Title -->
  <div class="page-title" data-aos="fade">
    <div class="heading">
      <div class="container">
        <div class="row d-flex justify-content-center text-center">
          <div class="col-lg-8">
            <h1>Résidences</h1>
            <p class="mb-0">Explorez les différentes résidences disponibles. Vous pouvez rechercher par adresse ou afficher les détails.</p>
          </div>
        </div>
      </div>
    </div>
    
  </div><!-- End Page Title -->

  <!-- Residences Section -->
  <section id="residences" class="residences section">
    <div class="container" data-aos="fade-up">
      <div class="row justify-content-center">
        <div class="col-md-6 d-flex align-items-stretch mb-4" *ngFor="let residence of filteredResidences">
          <div class="card w-100">
            <div class="card-img d-flex justify-content-center">
              <img [src]="residence.image" alt="{{ residence.name }}" class="img-fluid">
            </div>
            <div class="card-body">
              <h5 class="card-title text-center">{{ residence.name }}</h5>
              <p class="fst-italic text-center">
                <span *ngIf="residence.status === 'Disponible'">✅ Disponible</span>
                <span *ngIf="residence.status === 'En Construction'">🚧 En Construction</span>
                <span *ngIf="residence.status === 'Vendu'">❌ Vendu</span>
              </p>
              <p class="card-text text-center">{{ residence.description || 'Aucune description disponible' }}</p>
              <div class="d-flex justify-content-center gap-3">
                <a [routerLink]="['/residence', residence.id]" class="btn btn-info">🔍 Voir Détails</a>
                <a [routerLink]="['/apartments-by-residence', residence.id]" class="btn btn-primary">📃 Appartements List</a>
              </div>
            </div>
            <div class="card-footer text-center">
              <button (click)="likeResidence(residence)" class="btn btn-outline-danger me-2">❤️ Like</button>
              <button (click)="deleteResidence(residence.id)" class="btn btn-outline-danger">Supprimer</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section><!-- End Residences Section -->
</main>
